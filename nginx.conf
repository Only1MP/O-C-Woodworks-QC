server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for minimal bandwidth and ultra-fast page loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache hashed static assets permanently (Vite generates content-hashed filenames in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PWA service worker and manifest - always validate fresh
    location ~* (sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA routing fallback: try exact file, then directory, then fallback to /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Docker HEALTHCHECK, Kubernetes probes, and Cloud Run
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Custom error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
