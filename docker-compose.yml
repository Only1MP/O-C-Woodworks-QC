services:
  qc-defect-log:
    build:
      context: .
      dockerfile: Dockerfile
    image: daily-qc-defect-log:latest
    container_name: daily-qc-defect-log
    restart: unless-stopped
    ports:
      # Map host port 8084 or custom HOST_PORT to container web port 80
      - "${HOST_PORT:-8084}:80"
    environment:
      - PORT=80
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/qc_store.json
      - JWT_SECRET=woodshop-qc-tailscale-secure-key-9921
    volumes:
      # Persistent host volume: database & user accounts survive container restarts and rebuilds
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.woodshop.qc.app=daily-qc-defect-log"
